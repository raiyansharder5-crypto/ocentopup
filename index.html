<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean TopUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Bree+Serif&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        * {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #28B6F6;
            -webkit-tap-highlight-color: transparent;
        }

        /* Home Panel Specific Font */
        #home-sec {
            font-family: 'Bree Serif', serif;
        }
        #account-sec {
            font-family: 'Bree Serif', serif;
        }
        #tutorial-sec {
            font-family: 'Bree Serif', serif;
        }

        .nav-gradient {
            background: white;
            color: #1e293b;
        }
        .active-tab {
            color: #28B6F6 !important;
        }
        .hidden {
            display: none !important;
        }

        .font-en {
            font-family: 'Poppins', sans-serif;
        }
        .font-bn {
            font-family: 'Noto Serif Bengali', serif;
        }

        #home-sec .lang-auto {
            font-family: 'Bree Serif', serif;
        }
        .lang-auto:lang(bn),
        .lang-auto:lang(bn-BD) {
            font-family: 'Noto Serif Bengali', serif;
        }

        .notice-scroll {
            animation: scroll-left 15s linear infinite;
            display: inline-block;
            white-space: nowrap;
        }
        @keyframes scroll-left {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        .method-card {
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .method-card:active {
            transform: scale(0.95);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .animate-fade-in {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        /* PRODUCT CARD */
        .product-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .product-card:hover {
            border-color: #81d4fa;
        }
        .product-card.selected {
            border: 1.5px solid #28B6F6;
            background-color: #f0f9ff;
        }
        .product-bullet {
            height: 12px;
            width: 12px;
            background-color: #e5e7eb;
            border-radius: 50%;
            margin-right: 8px;
        }
        .product-card.selected .product-bullet {
            background-color: #28B6F6;
        }

        /* FAB */
        #fab-container.is-open #fab-toggler {
            background-color: #dc2626;
        }
        #fab-container.is-open #fab-icon-open {
            transform: rotate(-180deg) scale(0);
            opacity: 0;
        }
        #fab-container.is-open #fab-icon-close {
            transform: scale(1) rotate(0);
            opacity: 1;
        }
        #fab-container.is-open #fab-options {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .aspect-video {
            aspect-ratio: 16 / 9;
        }

        /* Step Transition */
        .step-transition {
            animation: slideInRight 0.3s ease-out forwards;
        }
        @keyframes slideInRight {
            from {
                transform: translateX(10%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .theme-bkash {
            background-color: #e2136e !important;
            border-color: #e2136e !important;
        }
        .theme-nagad {
            background-color: #f7941d !important;
            border-color: #f7941d !important;
        }
        .theme-rocket {
            background-color: #8c3494 !important;
            border-color: #8c3494 !important;
        }

        .text-theme-bkash {
            color: #e2136e !important;
        }
        .text-theme-nagad {
            color: #f7941d !important;
        }
        .text-theme-rocket {
            color: #8c3494 !important;
        }

        /* PAYMENT OPTION CARD */
        .pay-option-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
            background: white;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .pay-option-card.selected {
            border: 2px solid #ef4444;
        }
        .pay-option-card.selected::before {
            content: '\f00c';
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            position: absolute;
            top: 0;
            left: 0;
            background: #ef4444;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-bottom-right-radius: 6px;
            z-index: 10;
        }

        /* Related Products */
        .related-card {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .related-card:hover {
            border-color: #81d4fa;
            background: white;
        }
        .related-card.selected {
            border: 1.5px solid #28B6F6;
            background-color: #f0f9ff;
        }

        /* Offer Card */
        .offer-card {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 2px solid #f59e0b;
            border-radius: 16px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .offer-card::before {
            content: "🔥 SPECIAL OFFER";
            position: absolute;
            top: 8px;
            right: -40px;
            transform: rotate(45deg);
            background: #dc2626;
            color: white;
            font-size: 9px;
            font-weight: 800;
            padding: 4px 50px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .offer-card .offer-price {
            font-size: 28px;
            font-weight: 800;
            color: #dc2626;
        }
        .offer-card .original-price {
            font-size: 16px;
            color: #6b7280;
            text-decoration: line-through;
            margin-left: 10px;
        }
        .offer-card .discount-badge {
            background: #dc2626;
            color: white;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
        }
        .countdown-timer {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            font-family: 'Inter', monospace;
        }
        .countdown-timer .time-block {
            background: rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            padding: 6px 14px;
            text-align: center;
            min-width: 50px;
        }
        .countdown-timer .time-block .num {
            font-size: 22px;
            font-weight: 800;
            color: #1e293b;
            line-height: 1.2;
        }
        .countdown-timer .time-block .label {
            font-size: 8px;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .offer-expired {
            opacity: 0.6;
            filter: grayscale(0.5);
        }
        .offer-expired .countdown-timer .time-block .num {
            color: #94a3b8;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="select-none bg-slate-50">

    <div id="app-content" class="relative max-w-md mx-auto bg-slate-50 min-h-screen shadow-2xl">
        <!-- HEADER -->
        <header class="bg-white/90 backdrop-blur-md p-4 sticky top-0 z-40 flex justify-between items-center shadow-sm">

            </div>
            <div id="header-login-container">

        <!-- NOTICE -->
        <div id="notice-section" class="mb-0 px-3">

        <main class="p-3 relative pb-20">

            <!-- AUTH SECTION -->
            <section id="auth-sec" class="hidden animate-fade-in">

                    </button>

                    <div id="login-view">

                        <div class="relative flex py-2 items-center mb-6">
                            <div class="flex-grow border-t border-gray-200"></div>

                        </div>

                        </div>
                        <button onclick="handleLogin()" class="w-full bg-sky-600 text-white font-bold py-3 rounded-lg shadow-lg hover:bg-sky-700 transition duration-300">

                        <div class="mt-6 text-center text-sm text-gray-600">

                    </div>

                    <div id="register-view" class="hidden">
                        <h2 class="text-2xl font-bold text-gray-800 mb-6">Register</h2>
                        <button onclick="handleGoogleLogin()" class="w-full bg-white border border-gray-300 text-gray-700 font-semibold py-2.5 rounded-lg shadow-sm hover:bg-gray-50 transition flex items-center justify-center gap-3 mb-6">

                        </div>

                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-1">Phone</label>
                                <input type="number" id="reg-phone" placeholder="Phone" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500">
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-1">Email</label>
                                <input type="email" id="reg-email" placeholder="Email" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500">
                            </div>
                            <div>
                                <label class="block text-gray-700 text-sm font-bold mb-1">Password</label>
                                <input type="password" id="reg-pass" placeholder="Password" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500">
                            </div>
                        </div>
                        <button onclick="handleRegister()" class="w-full bg-sky-600 text-white font-bold py-3 rounded-lg shadow-lg hover:bg-sky-700 transition duration-300">
                            Register

                        <div class="mt-6 text-center text-sm text-gray-600">

                </div>
            </section>

            <!-- HOME SECTION -->

                        <div class="w-8 h-8 rounded-full ove
